<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Simplest Mock Server preview</title>
  <desc id="desc">A dark terminal showing mock API routes and a JSON response payload.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#131A24"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity=".07"/>
    </pattern>
    <clipPath id="window">
      <rect x="32" y="44" width="576" height="672" rx="24"/>
    </clipPath>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
  </defs>

  <rect width="640" height="760" fill="url(#bg)"/>
  <rect width="640" height="760" fill="url(#dots)"/>
  <circle cx="120" cy="120" r="160" fill="#0EA5E9" opacity=".18" filter="url(#glow)"/>
  <circle cx="550" cy="640" r="180" fill="#8B5CF6" opacity=".16" filter="url(#glow)"/>

  <g clip-path="url(#window)">
    <rect x="32" y="44" width="576" height="672" fill="#0F172A" fill-opacity=".92"/>
    <rect x="32" y="44" width="576" height="60" fill="#161F2E"/>
    <path d="M32 104h576" stroke="#273449"/>

    <circle cx="60" cy="74" r="6" fill="#F87171"/>
    <circle cx="82" cy="74" r="6" fill="#FBBF24"/>
    <circle cx="104" cy="74" r="6" fill="#34D399"/>
    <text x="128" y="80" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">mocks-server — zsh</text>
    <rect x="490" y="58" width="90" height="32" rx="16" fill="#052E2B" stroke="#0F766E"/>
    <text x="535" y="79" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">● running</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
      <text x="60" y="154" fill="#34D399">$</text>
      <text x="86" y="154" fill="#E2E8F0">npm run mocks</text>

      <text x="60" y="196" fill="#64748B">Starting mock server…</text>
      <text x="60" y="224" fill="#64748B">Loaded </text>
      <text x="142" y="224" fill="#93C5FD">12</text>
      <text x="170" y="224" fill="#64748B"> routes from </text>
      <text x="326" y="224" fill="#A5B4FC">mocks/routes</text>

      <text x="60" y="268" fill="#F472B6">GET</text>
      <text x="132" y="268" fill="#E2E8F0">/api/products</text>
      <text x="494" y="268" fill="#4ADE80">200</text>
      <text x="544" y="268" fill="#64748B">32ms</text>

      <text x="60" y="304" fill="#F472B6">GET</text>
      <text x="132" y="304" fill="#E2E8F0">/api/products/:id</text>
      <text x="494" y="304" fill="#4ADE80">200</text>
      <text x="544" y="304" fill="#64748B">18ms</text>

      <text x="60" y="340" fill="#FBBF24">POST</text>
      <text x="132" y="340" fill="#E2E8F0">/api/products</text>
      <text x="494" y="340" fill="#4ADE80">201</text>
      <text x="544" y="340" fill="#64748B">41ms</text>

      <text x="60" y="376" fill="#F472B6">GET</text>
      <text x="132" y="376" fill="#E2E8F0">/api/orders</text>
      <text x="494" y="376" fill="#4ADE80">200</text>
      <text x="544" y="376" fill="#64748B">27ms</text>

      <text x="60" y="412" fill="#FBBF24">POST</text>
      <text x="132" y="412" fill="#E2E8F0">/api/orders</text>
      <text x="494" y="412" fill="#4ADE80">201</text>
      <text x="544" y="412" fill="#64748B">36ms</text>

      <text x="60" y="448" fill="#F87171">DELETE</text>
      <text x="132" y="448" fill="#E2E8F0">/api/orders/:id</text>
      <text x="494" y="448" fill="#4ADE80">204</text>
      <text x="544" y="448" fill="#64748B">21ms</text>
    </g>

    <rect x="60" y="482" width="520" height="196" rx="14" fill="#0B1120" stroke="#273449"/>
    <rect x="60" y="482" width="520" height="42" rx="14" fill="#111C30"/>
    <path d="M60 524h520" stroke="#273449"/>
    <text x="82" y="509" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">response.json</text>
    <rect x="490" y="492" width="72" height="22" rx="11" fill="#052E2B" stroke="#0F766E"/>
    <text x="526" y="507" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">200 OK</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <text x="82" y="556" fill="#64748B">{</text>
      <text x="102" y="584" fill="#60A5FA">"id"</text>
      <text x="142" y="584" fill="#64748B">:</text>
      <text x="160" y="584" fill="#FBBF24">42</text>
      <text x="184" y="584" fill="#64748B">,</text>
      <text x="102" y="612" fill="#60A5FA">"name"</text>
      <text x="170" y="612" fill="#64748B">:</text>
      <text x="188" y="612" fill="#86EFAC">"Mechanical Keyboard"</text>
      <text x="388" y="612" fill="#64748B">,</text>
      <text x="102" y="640" fill="#60A5FA">"stock"</text>
      <text x="178" y="640" fill="#64748B">:</text>
      <text x="196" y="640" fill="#FBBF24">18</text>
      <text x="220" y="640" fill="#64748B">,</text>
      <text x="102" y="668" fill="#60A5FA">"active"</text>
      <text x="186" y="668" fill="#64748B">:</text>
      <text x="204" y="668" fill="#C084FC">true</text>
      <text x="82" y="696" fill="#64748B">}</text>
    </g>
  </g>

  <rect x="32" y="44" width="576" height="672" rx="24" fill="none" stroke="#334155" stroke-opacity=".7"/>
</svg>
