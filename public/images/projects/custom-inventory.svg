<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Custom Inventory API preview</title>
  <desc id="desc">A light inventory dashboard with product rows, stock levels, and status badges.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5EFE2"/>
      <stop offset="1" stop-color="#E9E0CE"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#FAF6EC"/>
    </linearGradient>
    <clipPath id="window">
      <rect x="34" y="44" width="572" height="672" rx="24"/>
    </clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#6B5D45" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="640" height="760" fill="url(#bg)"/>
  <circle cx="540" cy="120" r="170" fill="#D9C9A8" opacity=".45"/>
  <circle cx="90" cy="660" r="180" fill="#CBB894" opacity=".35"/>

  <g filter="url(#shadow)">
    <rect x="34" y="44" width="572" height="672" rx="24" fill="url(#card)"/>
  </g>

  <g clip-path="url(#window)">
    <rect x="34" y="44" width="572" height="72" fill="#FFFDF8"/>
    <path d="M34 116h572" stroke="#E7DFCE"/>
    <circle cx="70" cy="80" r="12" fill="#1E3A8A"/>
    <path d="M65 80h10M70 75v10" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="92" y="87" fill="#1F2937" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" letter-spacing="-.2">inventra</text>
    <rect x="438" y="64" width="98" height="32" rx="16" fill="#F1EADB" stroke="#E2D8C4"/>
    <text x="487" y="85" fill="#6B5D45" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Warehouse 01</text>
    <circle cx="566" cy="80" r="15" fill="#E8DCC7"/>
    <text x="566" y="85" fill="#6B5D45" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">EH</text>

    <!-- Sidebar -->
    <rect x="34" y="116" width="132" height="600" fill="#F6F0E3"/>
    <path d="M166 116v600" stroke="#E7DFCE"/>
    <rect x="50" y="142" width="100" height="36" rx="9" fill="#1E3A8A"/>
    <rect x="62" y="154" width="10" height="10" rx="2" fill="#FFF" opacity=".9"/>
    <text x="82" y="165" fill="#FFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Overview</text>

    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#786A52">
      <circle cx="66" cy="208" r="4" fill="#A6977D"/>
      <text x="80" y="213">Products</text>
      <circle cx="66" cy="246" r="4" fill="#A6977D"/>
      <text x="80" y="251">Orders</text>
      <circle cx="66" cy="284" r="4" fill="#A6977D"/>
      <text x="80" y="289">Suppliers</text>
      <circle cx="66" cy="322" r="4" fill="#A6977D"/>
      <text x="80" y="327">Reports</text>
      <circle cx="66" cy="360" r="4" fill="#A6977D"/>
      <text x="80" y="365">Settings</text>
    </g>
    <rect x="50" y="628" width="100" height="64" rx="10" fill="#EDE5D5"/>
    <text x="64" y="652" fill="#8A7A60" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600">API STATUS</text>
    <circle cx="68" cy="675" r="4" fill="#16A34A"/>
    <text x="80" y="679" fill="#4B7C5B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">healthy</text>

