    <text x="242" y="438" fill="#A6977D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">Electronics</text>
    <text x="358" y="430" fill="#786A52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">KB-1042</text>
    <text x="438" y="430" fill="#374151" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">142</text>
    <rect x="502" y="416" width="60" height="20" rx="10" fill="#DCFCE7"/>
    <text x="532" y="430" fill="#15803D" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">In stock</text>
    <path d="M208 454h356" stroke="#F1EADB"/>

    <!-- Row 2 -->
    <rect x="204" y="466" width="26" height="26" rx="7" fill="#FEF3C7"/>
    <rect x="211" y="473" width="12" height="12" rx="2" fill="#F59E0B"/>
    <text x="242" y="477" fill="#374151" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">USB-C Dock</text>
    <text x="242" y="492" fill="#A6977D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">Accessories</text>
    <text x="358" y="484" fill="#786A52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">DK-2210</text>
    <text x="438" y="484" fill="#374151" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">6</text>
    <rect x="502" y="470" width="60" height="20" rx="10" fill="#FEF3C7"/>
    <text x="532" y="484" fill="#B45309" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Low stock</text>
    <path d="M208 508h356" stroke="#F1EADB"/>

    <!-- Row 3 -->
    <rect x="204" y="520" width="26" height="26" rx="7" fill="#DCFCE7"/>
    <rect x="211" y="527" width="12" height="12" rx="2" fill="#22C55E"/>
    <text x="242" y="531" fill="#374151" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Studio Monitor</text>
    <text x="242" y="546" fill="#A6977D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">Audio</text>
    <text x="358" y="538" fill="#786A52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">MN-3305</text>
    <text x="438" y="538" fill="#374151" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">58</text>
    <rect x="502" y="524" width="60" height="20" rx="10" fill="#DCFCE7"/>
    <text x="532" y="538" fill="#15803D" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">In stock</text>
    <path d="M208 562h356" stroke="#F1EADB"/>

    <!-- Row 4 -->
    <rect x="204" y="574" width="26" height="26" rx="7" fill="#FEE2E2"/>
    <rect x="211" y="581" width="12" height="12" rx="2" fill="#EF4444"/>
    <text x="242" y="585" fill="#374151" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Laptop Stand</text>
    <text x="242" y="600" fill="#A6977D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">Accessories</text>
    <text x="358" y="592" fill="#786A52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">LS-1188</text>
    <text x="438" y="592" fill="#374151" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">0</text>
    <rect x="502" y="578" width="60" height="20" rx="10" fill="#FEE2E2"/>
    <text x="532" y="592" fill="#B91C1C" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Out</text>

    <text x="208" y="642" fill="#A6977D" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">Showing 4 of 1,248 products</text>
    <rect x="510" y="628" width="52" height="22" rx="6" fill="#F3ECDE"/>
    <text x="536" y="643" fill="#786A52" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">1 / 62</text>
  </g>

  <rect x="34" y="44" width="572" height="672" rx="24" fill="none" stroke="#DED4C0"/>
</svg>
