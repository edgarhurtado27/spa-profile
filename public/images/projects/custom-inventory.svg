    <text x="190" y="166" fill="#1F2937" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="-.4">Inventory</text>
    <text x="190" y="189" fill="#8A7A60" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Track products, stock, and supplier activity.</text>
    <rect x="490" y="146" width="92" height="34" rx="17" fill="#1E3A8A"/>
    <text x="536" y="168" fill="#FFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ Add item</text>

    <!-- Stats -->
    <rect x="190" y="216" width="118" height="84" rx="12" fill="#FBF7EE" stroke="#E7DFCE"/>
    <text x="204" y="240" fill="#8A7A60" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600">TOTAL SKUS</text>
    <text x="204" y="274" fill="#1F2937" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800">1,248</text>
    <rect x="190" y="216" width="4" height="84" rx="2" fill="#1E3A8A"/>

    <rect x="320" y="216" width="118" height="84" rx="12" fill="#FBF7EE" stroke="#E7DFCE"/>
    <text x="334" y="240" fill="#8A7A60" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600">LOW STOCK</text>
    <text x="334" y="274" fill="#B45309" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800">18</text>
    <rect x="320" y="216" width="4" height="84" rx="2" fill="#D97706"/>

    <rect x="450" y="216" width="132" height="84" rx="12" fill="#FBF7EE" stroke="#E7DFCE"/>
    <text x="464" y="240" fill="#8A7A60" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600">INVENTORY VALUE</text>
    <text x="464" y="274" fill="#1F2937" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="800">$84.2k</text>
    <rect x="450" y="216" width="4" height="84" rx="2" fill="#16A34A"/>

    <!-- Table -->
    <rect x="190" y="326" width="392" height="348" rx="14" fill="#FFFDF8" stroke="#E7DFCE"/>
    <text x="208" y="358" fill="#1F2937" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">Products</text>
    <rect x="466" y="340" width="98" height="28" rx="14" fill="#F3ECDE"/>
    <text x="515" y="358" fill="#8A7A60" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Search…</text>
    <path d="M208 378h356" stroke="#EEE6D7"/>

    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#A6977D">
